 <!DOCTYPE html>
<html>
<head>
    <title>Job Application Form</title>
</head>
<body>

    <h2>Job Application Form</h2>

    <form>

        <label>First Name:</label>
        <input type="text" name="fname"><br><br>

        <label>Last Name:</label>
        <input type="text" name="lname"><br><br>

        <label>Email:</label>
        <input type="email" name="email"><br><br>

        <label>Phone Number:</label>
        <input type="tel" name="phone"><br><br>

        <label>Choose Position:</label>
        <select>
            <option>Web Developer</option>
            <option>Designer</option>
            <option>Tester</option>
        </select><br><br>

        <label>Experience:</label><br>

        <input type="radio" name="exp">
        Fresher

        <input type="radio" name="exp">
        Experienced<br><br>

        <label>Known Languages:</label><br>

        <input type="checkbox"> HTML<br>
        <input type="checkbox"> CSS<br>
        <input type="checkbox"> JavaScript<br><br>

        <label>Date Available:</label>
        <input type="date"><br><br>

        <label>Upload CV:</label>
        <input type="file"><br><br>

        <label>About Yourself:</label><br>
        <textarea rows="5" cols="30"></textarea><br><br>

        <input type="submit" value="Apply Now">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
